name: fsi
description: "Flutter Supabase Instagram"
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  go_router: ^18.1.4
  image_picker: ^1.2.4
  video_player: ^2.14.1
  video_compress: ^3.1.4
  flutter_image_compress: ^2.5.1
  share_plus: ^13.3.1
  timeago: ^3.7.1
  flutter_slidable: ^5.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  path: ^1.9.1
  uuid: ^4.6.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  fonts:
    - family: Lato-Regular
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
    - family: Cookie-Regular
      fonts:
        - asset: assets/fonts/Cookie-Regular.ttf